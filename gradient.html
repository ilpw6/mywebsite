<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Градіенти</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            margin: 20px;
            float: left;
        }
    </style>
</head>
<body>
 <p style="font-size: 1in;background: linear-gradient(to left,orange, red, yellow, lime, blue, purple, indigo); color: white;text-align: center;">Ми вивчаємо градіенти</p>   
<div style="background:linear-gradient(yellow,blue) ;"></div>
 <div style="background:linear-gradient(45deg,yellow,blue) ;"></div>
 <div style="background:linear-gradient(225deg,yellow,blue) ;"></div>
 <div style="background:linear-gradient(225deg,yellow 20%,blue 80%) ;"></div>
 <div style="background:linear-gradient(225deg,yellow 50%,blue 50%) ;"></div>
 <div style="background:linear-gradient(blue 50%, yellow 50%) ;width: 450px;"></div>
<div style="width:450px ; height: 300px; background: linear-gradient(red 25, blue 25% 50%, yellow 50% 75%, green 75% 90%);"></div> 
<div style="background:radial-gradient(yellow,blue) ;"></div>
<div style="background:radial-gradient(circle at 25% 25% yellow,blue) ;"></div>
<div style="background:radial-gradient(circle at 75% 75% yellow,blue) ;"></div>
<div style="background:radial-gradient(circle at 50% 100% yellow,blue) ;"></div>

</body>
</html>
